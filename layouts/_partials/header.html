<header class="site-header wrap">
  <a class="site-name" href="{{ "/" | relURL }}">{{ site.Title }}</a>
  <nav aria-label="Main">
    {{- $cur := . }}
    {{- range site.Menus.main }}
      <a href="{{ .URL }}"{{ if or ($cur.IsMenuCurrent "main" .) ($cur.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{- end }}
  </nav>
</header>
