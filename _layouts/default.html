<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · Devanandan J</title>
  <meta name="description" content="{{ page.description | default: page.title | escape }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23181818'/%3E%3Crect x='9' y='7' width='12' height='18' fill='%2373c936'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cantarell&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <a href="/">Devanandan J</a>
    <nav aria-label="Main"><a href="/projects/">PROJECTS</a></nav>
  </header>
  <main>
    <h1>{{ page.title | escape }}</h1>
    {% if page.status %}<p class="status">{{ page.status }}{% if page.when %} ({{ page.when }}){% endif %}</p>{% endif %}
    {% if page.repo %}<p class="repo"><a href="{{ page.repo }}">{{ page.repo }}</a></p>{% endif %}
{{ content }}
  </main>
</body>
</html>
