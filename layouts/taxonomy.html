{{ define "main" }}
<div class="wrap">
  <h1 class="page-title">Tags</h1>
  <p class="tags">
    {{ range .Data.Terms.ByCount }}<a href="{{ .Page.RelPermalink }}">#{{ .Page.LinkTitle }} <span class="meta">{{ .Count }}</span></a>
    {{ else }}<span class="meta">No tags yet.</span>{{ end }}
  </p>
</div>
{{ end }}
