baseURL = 'https://devanandanj.github.io/'
locale = 'en-us'
title = 'Devanandan J'
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = 'tags'

[params]
  author = 'Devanandan J'
  handle = 'devanandanj'
  description = 'Notes and projects on FPGA design, digital hardware and low-latency systems.'
  intro = "I'm a student building FPGA hardware for things that need to be fast. Right now that's a 1G Ethernet MAC and an ITCH 5.0 order book on an old Virtex-5. I write down what I learn here."
  github = 'https://github.com/devanandanj'
  # linkedin = 'https://www.linkedin.com/in/...'
  # email = 'you@example.com'

[menus]
  [[menus.main]]
    name = 'writing'
    pageRef = '/posts'
    weight = 10
  [[menus.main]]
    name = 'tags'
    pageRef = '/tags'
    weight = 20

[markup]
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  home = ['html', 'rss']
