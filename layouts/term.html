{{ define "main" }}
<h1>#{{ .Title }}</h1>
{{ with .Description }}<p class="muted">{{ . }}</p>{{ end }}
{{ $paginator := .Paginate .RegularPages }}
{{ with $paginator.Pages }}
  <ul class="posts">{{ range . }}{{ partial "post-item.html" . }}{{ end }}</ul>
{{ else }}
  <p class="muted">nothing here yet.</p>
{{ end }}
{{ partial "pager.html" . }}
{{ end }}
